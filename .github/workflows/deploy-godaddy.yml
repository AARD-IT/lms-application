
name: Deploy LMS Frontend to GoDaddy

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-godaddy.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy-lms-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # 3. Install dependencies
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: https://lms-application-yojp.onrender.com
        run: npm run build

      # 5. Test GoDaddy SSH connection
      - name: Test GoDaddy SSH connection
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GODADDY_HOST }}
          username: ${{ secrets.GODADDY_USERNAME }}
          key: ${{ secrets.GODADDY_SSH_KEY }}
          port: ${{ secrets.GODADDY_PORT }}
          command_timeout: 30s
          script: |
            echo "SSH connection successful"
            whoami
            pwd
            ls -ld ~/public_html/lms.analyticsavenuerd.in

      # 6. Upload frontend build to GoDaddy
      - name: Upload frontend build to GoDaddy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GODADDY_HOST }}
          username: ${{ secrets.GODADDY_USERNAME }}
          key: ${{ secrets.GODADDY_SSH_KEY }}
          port: ${{ secrets.GODADDY_PORT }}
          source: "client/dist/*"
          target: "/home/qi7n5bza7u0r/public_html/lms.analyticsavenuerd.in/"
          strip_components: 2
          overwrite: true
