
name: Deploy LMS Frontend to GoDaddy

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/deploy-godaddy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godaddy-lms-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_URL: https://lms-application-yojp.onrender.com
        run: npm run build

      - name: Upload frontend build to GoDaddy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GODADDY_HOST }}
          username: ${{ secrets.GODADDY_USERNAME }}
          key: ${{ secrets.GODADDY_SSH_KEY }}
          port: ${{ secrets.GODADDY_PORT }}
          source: "client/dist/*"
          target: "/home/qi7n5bza7u0r/public_html/lms.analyticsavenuerd.in/"
          strip_components: 2
          overwrite: true
